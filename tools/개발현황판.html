<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>품 개발 현황판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style id="css">
  /* ══════════════════════════════════════════════════════════════════
     서체 — 한글에는 고정폭 서체를 쓰지 않습니다.

     이전 판은 「완료」·「서버」·「01단계」 같은 라벨에 IBM Plex Mono를 썼는데,
     그 서체에는 한글이 없어 브라우저가 조용히 다른 서체로 바꿔 그렸습니다 —
     글자마다 굵기와 폭이 달라 보이던 원인입니다. 고정폭은 **숫자·날짜에만**
     씁니다(표에서 자리가 맞아야 세로로 읽힙니다).
     ══════════════════════════════════════════════════════════════════ */
  :root {
    --font-sans: Pretendard, "Noto Sans KR", "Malgun Gothic", sans-serif;
    --font-num: "IBM Plex Mono", ui-monospace, Consolas, monospace;

    --paper:   #FFFFFF;
    --panel:   #F4F7F5;
    --panel-2: #E9EFEB;
    --ink:     #121D18;
    --muted:   #4E5B53;
    --rule:    #D8E0DB;

    --done:      #1F5C43;
    --done-bg:   #E4EFE9;
    --wip:       #97600F;
    --wip-bg:    #FBF1DF;
    --blocked:   #8E3325;
    --blocked-bg:#FAEBE8;
    --todo:      #66736B;
    --todo-bg:   #EDF1EE;

    --shadow: 0 1px 2px rgba(18,29,24,.06), 0 10px 28px -14px rgba(18,29,24,.14);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#0D1411; --panel:#151E19; --panel-2:#1E2924;
      --ink:#EBF1EC; --muted:#A3B2A9; --rule:#2A3631;
      --done:#6FB795; --done-bg:#172A20;
      --wip:#DFAE68; --wip-bg:#2B2216;
      --blocked:#E89684; --blocked-bg:#2C1C19;
      --todo:#8B998F; --todo-bg:#1C2421;
      --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 28px -14px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"] {
    --paper:#0D1411; --panel:#151E19; --panel-2:#1E2924;
    --ink:#EBF1EC; --muted:#A3B2A9; --rule:#2A3631;
    --done:#6FB795; --done-bg:#172A20;
    --wip:#DFAE68; --wip-bg:#2B2216;
    --blocked:#E89684; --blocked-bg:#2C1C19;
    --todo:#8B998F; --todo-bg:#1C2421;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 28px -14px rgba(0,0,0,.7);
  }

  * { box-sizing: border-box; }
  img, svg { max-width: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.68;
    letter-spacing: -.003em;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    word-break: keep-all;
  }

  /** 숫자·날짜 전용 */
  .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: 0; }

  .wrap { max-width: 1140px; margin: 0 auto; padding: 34px 28px 76px; display: flex; flex-direction: column; gap: 32px; }

  /* ── 머리말 ─────────────────────────────────────────────────── */
  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 18px; }
  h1 { margin: 0; font-size: 29px; font-weight: 700; letter-spacing: -.028em; line-height: 1.25; }
  header .sub { margin: 6px 0 0; font-size: 14.5px; color: var(--muted); max-width: 62ch; }
  .head-side { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .stamp { margin: 0; font-size: 12.5px; color: var(--muted); text-align: right; line-height: 1.55; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--rule); background: var(--paper); color: var(--ink);
    border-radius: 9px; padding: 8px 14px;
    font-family: var(--font-sans); font-size: 13.5px; font-weight: 600;
    cursor: pointer; white-space: nowrap;
    transition: background .13s ease, border-color .13s ease, opacity .13s ease;
  }
  .btn:hover { background: var(--panel); }
  .btn:focus-visible { outline: 2px solid var(--done); outline-offset: 2px; }
  .btn.primary { background: var(--done); border-color: var(--done); color: #fff; }
  .btn.primary:hover { filter: brightness(1.07); background: var(--done); }
  .btn:disabled { opacity: .45; cursor: default; }

  /* ── 저장 막대 ──────────────────────────────────────────────── */
  .savebar {
    display: none; align-items: center; flex-wrap: wrap; gap: 12px;
    background: var(--wip-bg); border: 1px solid var(--wip);
    border-radius: 11px; padding: 12px 16px;
    font-size: 14px; font-weight: 600; color: var(--ink);
  }
  .savebar.on { display: flex; }
  .savebar .spacer { flex: 1; }
  .savebar .msg { font-weight: 500; color: var(--muted); font-size: 13.5px; }

  .banner {
    display: none; gap: 10px; align-items: flex-start;
    background: var(--panel); border: 1px solid var(--rule);
    border-radius: 11px; padding: 13px 16px;
    font-size: 13.5px; line-height: 1.6; color: var(--muted);
  }
  .banner.on { display: flex; }
  .banner b { color: var(--ink); }

  /* ── 요약 타일 ──────────────────────────────────────────────── */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 13px; }
  .tile { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 16px 18px; }
  .tile dt { font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .tile dd { margin: 8px 0 0; font-size: 30px; font-weight: 700; line-height: 1.1; letter-spacing: -.02em; display: flex; align-items: baseline; gap: 3px; }
  .tile dd .unit { font-size: 15px; font-weight: 600; color: var(--muted); letter-spacing: -.01em; }
  .tile .note { margin: 6px 0 0; font-size: 13px; color: var(--muted); line-height: 1.55; }

  /* ── 절 ─────────────────────────────────────────────────────── */
  section { display: flex; flex-direction: column; gap: 14px; }
  .sec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px; }
  h2 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.02em; }
  .sec-head .hint { margin: 0; font-size: 13px; color: var(--muted); }

  /* ── 타임라인 ───────────────────────────────────────────────── */
  .tl-scroll { overflow-x: auto; padding-bottom: 2px; }
  .tl { min-width: 760px; border: 1px solid var(--rule); border-radius: 12px; background: var(--paper); overflow: hidden; }
  .tl-months { display: flex; border-bottom: 1px solid var(--rule); background: var(--panel); }
  .tl-month { flex: 1; padding: 8px 0; text-align: center; font-size: 12.5px; font-weight: 600; color: var(--muted); border-right: 1px solid var(--rule); }
  .tl-month:last-child { border-right: 0; }
  .tl-rows { position: relative; padding: 13px 0 6px; }
  .tl-row { position: relative; height: 33px; margin: 0 13px; }
  .tl-bar {
    position: absolute; top: 5px; height: 23px; border-radius: 6px;
    background: var(--todo-bg); border: 1px solid var(--rule); overflow: hidden;
    cursor: pointer; font-family: var(--font-sans);
    transition: transform .13s ease, box-shadow .13s ease;
  }
  .tl-bar:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
  .tl-bar:focus-visible { outline: 2px solid var(--done); outline-offset: 2px; }
  .tl-fill { position: absolute; inset: 0 auto 0 0; background: var(--done); opacity: .9; transition: width .6s cubic-bezier(.2,.8,.2,1); }
  .tl-label { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 9px; font-size: 12.5px; font-weight: 600; white-space: nowrap; color: var(--ink); }
  .tl-bar.filled .tl-label { color: #fff; }
  .tl-today { position: absolute; top: 0; bottom: 8px; width: 2px; background: var(--blocked); z-index: 3; }
  .tl-today span { position: absolute; top: -2px; left: 5px; font-size: 12px; font-weight: 700; color: var(--blocked); white-space: nowrap; }

  /* ── 상태 칩 ────────────────────────────────────────────────── */
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 11px; border-radius: 20px;
    font-family: var(--font-sans); font-size: 12.5px; font-weight: 600;
    white-space: nowrap; border: 1px solid transparent;
  }
  .chip.done    { background: var(--done-bg);    color: var(--done); }
  .chip.wip     { background: var(--wip-bg);     color: var(--wip); }
  .chip.blocked { background: var(--blocked-bg); color: var(--blocked); }
  .chip.todo    { background: var(--todo-bg);    color: var(--todo); }
  button.chip { cursor: pointer; transition: filter .13s ease, transform .1s ease; }
  button.chip:hover { filter: brightness(.96); transform: translateY(-1px); }
  button.chip:focus-visible { outline: 2px solid var(--done); outline-offset: 2px; }
  button.chip:disabled { cursor: default; transform: none; filter: none; }
  button.chip.dirty { border-color: currentColor; }
  button.chip .dot { font-size: 9px; opacity: .8; }

  /* ── 조작 줄 ────────────────────────────────────────────────── */
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .seg { display: flex; gap: 5px; flex-wrap: wrap; }
  .seg button {
    border: 1px solid var(--rule); background: var(--paper); color: var(--muted);
    border-radius: 20px; padding: 6px 14px;
    font-family: var(--font-sans); font-size: 13.5px; font-weight: 600; cursor: pointer;
    transition: background .13s ease, color .13s ease, border-color .13s ease;
  }
  .seg button:hover { background: var(--panel); color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--done); border-color: var(--done); color: #fff; }
  .seg button:focus-visible { outline: 2px solid var(--done); outline-offset: 2px; }
  .seg .n { font-family: var(--font-num); font-size: 12px; opacity: .85; margin-left: 4px; }
  .search {
    flex: 1 1 210px; min-width: 180px;
    border: 1px solid var(--rule); background: var(--paper); color: var(--ink);
    border-radius: 9px; padding: 8px 13px; font-family: var(--font-sans); font-size: 14px;
  }
  .search::placeholder { color: var(--muted); opacity: .85; }
  .search:focus-visible { outline: 2px solid var(--done); outline-offset: 1px; }
  .divider { width: 1px; height: 22px; background: var(--rule); }

  /* ── 스프린트 카드 ──────────────────────────────────────────── */
  .sprints { display: flex; flex-direction: column; gap: 12px; }
  .sprint { border: 1px solid var(--rule); border-radius: 12px; background: var(--paper); overflow: hidden; }
  .sprint.now { border-color: var(--done); box-shadow: var(--shadow); }
  .sprint.dim { opacity: .55; }
  .sp-head {
    width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 14px;
    align-items: center; padding: 15px 18px; background: none; border: 0;
    font-family: var(--font-sans); color: inherit; text-align: left; cursor: pointer;
  }
  .sp-head:hover { background: var(--panel); }
  .sp-head:focus-visible { outline: 2px solid var(--done); outline-offset: -2px; }
  .sp-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; }
  .sp-no { font-size: 12.5px; font-weight: 700; color: var(--muted); }
  .sp-name { font-size: 16.5px; font-weight: 700; letter-spacing: -.02em; }
  .sp-dates { font-size: 12.5px; color: var(--muted); }
  .sp-tag { background: var(--done); color: #fff; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 20px; }
  .sp-meter { display: flex; align-items: center; gap: 11px; }
  .meter { width: 104px; height: 8px; border-radius: 20px; background: var(--panel-2); overflow: hidden; }
  .meter span { display: block; height: 100%; background: var(--done); border-radius: 20px; transition: width .6s cubic-bezier(.2,.8,.2,1); }
  .sp-pct { font-size: 15px; font-weight: 700; min-width: 46px; text-align: right; }
  .sp-caret { color: var(--muted); font-size: 12px; width: 14px; text-align: center; }
  .sp-body { border-top: 1px solid var(--rule); padding: 5px 18px 15px; }
  .sprint[data-open="false"] .sp-body { display: none; }

  .items { list-style: none; margin: 0; padding: 0; }
  .item { display: grid; grid-template-columns: 62px 1fr auto; gap: 14px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--rule); }
  .item:last-child { border-bottom: 0; }
  .item .area { font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .item .what { font-size: 15px; line-height: 1.6; }
  .item .why { display: block; margin-top: 4px; font-size: 13.5px; color: var(--muted); line-height: 1.6; }
  .item mark { background: var(--wip-bg); color: var(--ink); border-radius: 3px; padding: 0 2px; }
  .item.hidden { display: none; }
  .empty { padding: 14px 0; font-size: 14px; color: var(--muted); }

  /* ── 표 ─────────────────────────────────────────────────────── */
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  thead th { text-align: left; font-size: 12.5px; font-weight: 600; color: var(--muted); padding: 0 16px 8px 0; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  tbody td, tbody th { text-align: left; padding: 12px 16px 12px 0; vertical-align: top; line-height: 1.6; }
  tbody th { font-weight: 700; }
  tbody td { color: var(--muted); }
  tbody tr { border-bottom: 1px solid var(--rule); }
  tbody tr:last-child { border-bottom: 0; }

  /* ── 변경 기록 ──────────────────────────────────────────────── */
  .log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0; }
  .log li { display: grid; grid-template-columns: 108px 1fr; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
  .log li:last-child { border-bottom: 0; }
  .log .when { color: var(--muted); font-size: 12.5px; }
  .log .none { color: var(--muted); font-size: 14px; padding: 10px 0; }

  /* ── 활동 그래프 ────────────────────────────────────────────── */
  .bars { display: flex; align-items: flex-end; gap: 11px; height: 108px; padding-top: 8px; }
  .bars .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 7px; height: 100%; justify-content: flex-end; }
  .bars .b { width: 100%; max-width: 52px; background: var(--done); border-radius: 5px 5px 0 0; min-height: 4px; transition: height .6s cubic-bezier(.2,.8,.2,1); }
  .bars .col:hover .b { filter: brightness(1.1); }
  .bars .n { font-size: 13px; font-weight: 700; }
  .bars .d { font-size: 12px; color: var(--muted); }

  .callout { border-left: 3px solid var(--wip); background: var(--wip-bg); border-radius: 0 10px 10px 0; padding: 14px 17px; font-size: 14.5px; line-height: 1.68; }

  footer { border-top: 1px solid var(--rule); padding-top: 18px; font-size: 13px; color: var(--muted); line-height: 1.75; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  @media (max-width: 700px) {
    .wrap { padding: 24px 16px 52px; gap: 26px; }
    h1 { font-size: 23px; }
    .item { grid-template-columns: 1fr auto; }
    .item .area { grid-column: 1 / -1; }
    .sp-meter .meter { width: 64px; }
    .tile dd { font-size: 25px; }
    .log li { grid-template-columns: 1fr; gap: 2px; }
  }

  @media print {
    .controls, .sp-caret, .btn, .savebar, .banner { display: none !important; }
    .sprint[data-open="false"] .sp-body { display: block; }
    .sprint.dim { opacity: 1; }
    .wrap { padding: 0; gap: 20px; }
    .sprint, .tl, .tiles, .callout { break-inside: avoid; }
  }
</style>
</head>

      </div>

      </div>

    <section>
      <div class="sec-head">

        <p class="hint">개발로는 해결되지 않는 항목입니다.</p>
      </div>
      <div class="scroll">
        <table>
          <thead><tr><th>항목</th><th>없으면 못 하는 것</th><th>필요한 조치</th><th>구분</th></tr></thead>
          <tbody id="ext"></tbody>
        </table>
      </div>
    </section>

    <section>
      <div class="sec-head">
        <h2>작업량 추이</h2>
        <p class="hint">날짜별로 저장소에 반영된 변경 묶음 수입니다.</p>
      </div>
      <div class="bars" id="bars"></div>
    </section>

    <footer id="foot"></footer>
  </div>
</template>

<script id="app">
/* ══════════════════════════════════════════════════════════════════
   품 개발 현황판

   **여러 사람이 함께 고칩니다.** 팀원이 상태를 바꾸고 「팀에 저장」을 누르면
   이 페이지가 스스로를 새 버전으로 발행하고, 열려 있는 모든 화면이 그 버전으로
   갱신됩니다. 공유되는 것은 아래 `state`에 담긴 값뿐입니다 —
   필터·검색·펼침·화면 밝기 같은 개인 화면 상태는 각자의 것으로 남습니다.

   저장할 수 없는 경우(바탕화면 파일로 열었을 때, 보기 권한만 받은 팀원)에는
   **읽기 전용으로 동작**합니다. 상태 표시가 눌리지 않고 그 이유를 위쪽에
   안내합니다.
   ══════════════════════════════════════════════════════════════════ */

const WEIGHT = { done: 1, wip: 0.5, blocked: 0, todo: 0 };
const LABEL  = { done: "완료", wip: "진행 중", blocked: "막힘", todo: "미착수" };
const CYCLE  = ["todo", "wip", "done", "blocked"];
const THEME_KEY = "foom-board-theme";
const LOG_MAX = 12;

/** 발행된 값 — 모든 사람이 같이 봅니다 */
let base = JSON.parse(document.getElementById("state").textContent);
/** 내가 눌러서 바꾼 값. 저장 전까지는 나만 봅니다 */
let state = structuredClone(base);
/** 저장 못 하는 상황이면 true */
let readOnly = false;
let saving = false;

/** 개인 화면 상태 — 발행 대상이 아닙니다 */
const view = { status: "all", area: "all", q: "" };
const openMap = new Map();

const root = document.getElementById("root");
root.innerHTML = document.getElementById("skeleton").innerHTML;
const $ = (id) => document.getElementById(id);

/* ── 도우미 ─────────────────────────────────────────────────── */
const today = new Date(); today.setHours(0, 0, 0, 0);
const d = (s) => { const [y, m, day] = s.split("-").map(Number); return new Date(y, m - 1, day); };
const fmt = (s) => { const [, m, day] = s.split("-").map(Number); return `${m}/${day}`; };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function pctOf(s) {
  const got = s.items.reduce((sum, it) => sum + WEIGHT[it.status], 0);
  return Math.round((got / s.items.length) * 100);
}
function counts() {
  const c = { done: 0, wip: 0, blocked: 0, todo: 0 };
  for (const s of state.sprints) for (const it of s.items) c[it.status] += 1;
  return c;
}
function overallPct() {
  let got = 0, n = 0;
  for (const s of state.sprints) for (const it of s.items) { got += WEIGHT[it.status]; n += 1; }
  return Math.round((got / n) * 100);
}
const totalItems = () => state.sprints.reduce((n, s) => n + s.items.length, 0);
const currentSprint = () => state.sprints.find((s) => d(s.from) <= today && today <= d(s.to)) ?? null;

/** 저장 전 바뀐 항목 목록 */
function pending() {
  const out = [];
  state.sprints.forEach((s, si) => s.items.forEach((it, ii) => {
    const was = base.sprints[si].items[ii].status;
    if (was !== it.status) out.push({ s, it, was, now: it.status });
  }));
  return out;
}

function hits(s, it) {
  if (view.status !== "all" && it.status !== view.status) return false;
  if (view.area !== "all" && it.area !== view.area) return false;
  if (view.q) {
    const hay = (it.what + " " + (it.why ?? "") + " " + s.name).toLowerCase();
    if (!hay.includes(view.q.toLowerCase())) return false;
  }
  return true;
}
function mark(text) {
  if (!view.q) return esc(text);
  const re = new RegExp("(" + view.q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
  return esc(text).replace(re, "<mark>$1</mark>");
}

/* ── 그리기 ─────────────────────────────────────────────────── */

function renderHead() {
  $("stamp").textContent = state.updated;
  $("rev").textContent = `${state.rev}번째 판 · 함께 편집`;
}

function renderBanner() {
  const box = $("banner");
  if (!readOnly) { box.classList.remove("on"); return; }
  box.classList.add("on");
  $("banner-text").innerHTML =
    "<b>읽기 전용으로 열렸습니다.</b> 상태를 바꿔 저장하려면 편집 권한이 있는 공유 링크로 여세요. " +
    "바탕화면 파일로 열었을 때도 저장이 되지 않습니다 — 그 경우는 링크로 접속해 주세요.";
}

function renderSaveBar() {
  const list = pending();
  const bar = $("savebar");
  if (readOnly || list.length === 0) { bar.classList.remove("on"); return; }
  bar.classList.add("on");
  $("save-count").textContent = `아직 저장하지 않은 변경 ${list.length}개`;
  $("save-msg").textContent = saving ? "저장하는 중…" : "저장하면 팀원 모두의 화면에 반영됩니다.";
  $("save").disabled = saving;
  $("discard").disabled = saving;
}

function renderTiles() {
  const c = counts();
  const cur = currentSprint();
  const days = Math.floor((today - d(state.totals.startedOn)) / 86400000) + 1;
  $("tiles").innerHTML = [
    { dt: "전체 진행률", n: overallPct(), unit: "%",
      note: `계획 항목 ${totalItems()}개 기준 · 완료 ${c.done} · 진행 중 ${c.wip} · 막힘 ${c.blocked}` },
    { dt: "현재 단계", n: cur ? cur.no : "—", unit: cur ? "단계" : "",
      note: cur ? `${esc(cur.name)} · ${fmt(cur.from)}~${fmt(cur.to)}` : "일정 구간 밖" },
    { dt: "개발 기간", n: days, unit: "일차", note: `${state.totals.startedOn.replace(/-/g, ".")} 시작` },
    { dt: "자동 점검", n: state.totals.tests, unit: "종", note: `전부 통과 · 변경 묶음 ${state.totals.commits}건` },
  ].map((t) => `
    <div class="tile"><dt>${t.dt}</dt>
      <dd><span class="num">${t.n}</span><span class="unit">${t.unit}</span></dd>
      <p class="note">${t.note}</p></div>`).join("");
}

function renderTimeline() {
  const start = d(state.sprints[0].from), end = d("2026-12-31");
  const pos = (date) => ((d(date) - start) / (end - start)) * 100;

  $("tl-months").innerHTML = ["8월", "9월", "10월", "11월", "12월"]
    .map((m) => `<div class="tl-month">${m}</div>`).join("");

  $("tl-rows").innerHTML = state.sprints.map((s) => {
    const pct = pctOf(s);
    const left = pos(s.from);
    const width = Math.max(pos(s.to) - left, 4);
    // 채움이 좁으면 흰 글자가 연한 배경 위에 놓여 안 읽힙니다.
    const filled = pct >= 55;
    return `<div class="tl-row">
      <button type="button" class="tl-bar${filled ? " filled" : ""}"
        style="left:${left}%;width:${width}%" data-go="${s.no}"
        aria-label="${s.no}단계 ${esc(s.name)}, ${fmt(s.from)}부터 ${fmt(s.to)}까지, ${pct}퍼센트 완료">
        <span class="tl-fill" style="width:${pct}%"></span>
        <span class="tl-label">${s.no}. ${esc(s.name)} · ${pct}%</span>
      </button></div>`;
  }).join("") +
  `<div class="tl-today" style="left:${Math.min(Math.max(pos(state.updated), 0), 100)}%"><span>오늘</span></div>`;
}

function renderCallout() {
  const cur = currentSprint();
  const ahead = state.sprints.filter((s) => d(s.from) > today && pctOf(s) > 0);
  $("callout").innerHTML = `
    <b>작업이 계획 순서대로만 진행되지는 않았습니다.</b>
    지금은 ${cur ? cur.no + "단계 구간" : "일정 구간 밖"}인데,
    ${ahead.length ? ahead.map((s) => `${s.no}단계(${pctOf(s)}%)`).join(" · ") + "의 항목이 이미 일부 또는 전부 끝났습니다." : "앞선 단계에서 미리 끝낸 항목이 없습니다."}
    막을 수 있는 것을 먼저 치우고, 결제 계약에 걸린 항목은 뒤로 미룬 결과입니다.
    <br><b>남은 위험은 개발이 아니라 계약과 디자인입니다</b> — 아래 두 절에 정리돼 있습니다.`;
}

function renderFilters() {
  const c = counts();
  $("f-status").innerHTML = [
    ["all", "전체", totalItems()], ["done", "완료", c.done], ["wip", "진행 중", c.wip],
    ["blocked", "막힘", c.blocked], ["todo", "미착수", c.todo],
  ].map(([k, label, n]) =>
    `<button type="button" data-status="${k}" aria-pressed="${view.status === k}">${label}<span class="n">${n}</span></button>`
  ).join("");

  $("f-area").innerHTML = ["all", "서버", "화면", "공통"].map((a) =>
    `<button type="button" data-area="${a}" aria-pressed="${view.area === a}">${a === "all" ? "전 영역" : a}</button>`
  ).join("");
}

function renderSprints() {
  const filtering = view.status !== "all" || view.area !== "all" || view.q !== "";
  const cur = currentSprint();

  $("sprints").innerHTML = state.sprints.map((s, si) => {
    const pct = pctOf(s);
    const isNow = cur && cur.no === s.no;
    const past = d(s.to) < today;
    const shown = s.items.filter((it) => hits(s, it));
    const isOpen = filtering ? shown.length > 0 : (openMap.has(s.no) ? openMap.get(s.no) : isNow);

    return `<article class="sprint${isNow ? " now" : ""}${filtering && shown.length === 0 ? " dim" : ""}"
      data-no="${s.no}" data-open="${isOpen}">
      <button type="button" class="sp-head" aria-expanded="${isOpen}">
        <span class="sp-title">
          <span class="sp-no">${s.no}단계</span>
          <span class="sp-name">${esc(s.name)}</span>
          <span class="sp-dates num">${fmt(s.from)} ~ ${fmt(s.to)}</span>
          ${isNow ? '<span class="sp-tag">진행 구간</span>' : ""}
          ${past && pct < 100 ? '<span class="chip wip">기간 지남</span>' : ""}
          ${filtering ? `<span class="sp-dates">${shown.length}개 해당</span>` : ""}
        </span>
        <span class="sp-meter">
          <span class="meter"><span style="width:${pct}%"></span></span>
          <span class="sp-pct"><span class="num">${pct}</span>%</span>
          <span class="sp-caret">${isOpen ? "▲" : "▼"}</span>
        </span>
      </button>
      <div class="sp-body">
        <ul class="items">
          ${s.items.map((it, ii) => {
            const dirty = base.sprints[si].items[ii].status !== it.status;
            return `<li class="item${hits(s, it) ? "" : " hidden"}">
              <span class="area">${it.area}</span>
              <span class="what">${mark(it.what)}${it.why ? `<span class="why">${mark(it.why)}</span>` : ""}</span>
              <button type="button" class="chip ${it.status}${dirty ? " dirty" : ""}"
                data-sp="${si}" data-i="${ii}" ${readOnly ? "disabled" : ""}
                title="${readOnly ? "읽기 전용입니다" : "누르면 다음 상태로 바뀝니다"}"
                aria-label="${esc(it.what)} 상태 ${LABEL[it.status]}${readOnly ? "" : ". 누르면 바뀝니다"}">
                ${dirty ? '<span class="dot">●</span>' : ""}${LABEL[it.status]}
              </button></li>`;
          }).join("")}
        </ul>
        ${shown.length === 0 ? '<p class="empty">이 조건에 해당하는 항목이 없습니다.</p>' : ""}
      </div></article>`;
  }).join("");
}

function renderLog() {
  const el = $("log");
  if (!state.log || state.log.length === 0) {
    el.innerHTML = '<li class="none">아직 바뀐 기록이 없습니다.</li>';
    return;
  }
  el.innerHTML = state.log.map((e) => `
    <li><span class="when num">${esc(e.at)}</span>
      <span>${esc(e.what)} — <b>${esc(e.to)}</b><span style="color:var(--muted)"> (이전 ${esc(e.from)})</span></span></li>`
  ).join("");
}

function renderExt() {
  $("ext").innerHTML = state.external.map((e) => `
    <tr><th>${esc(e.name)}</th><td>${esc(e.blocks)}</td><td>${esc(e.action)}</td>
      <td><span class="chip ${e.kind}">${esc(e.tag)}</span></td></tr>`).join("");
}

function renderBars() {
  const peak = Math.max(...state.activity.map((a) => a.n));
  $("bars").innerHTML = state.activity.map((a) => `
    <div class="col" title="${a.date} · 변경 묶음 ${a.n}건">
      <span class="n num">${a.n}</span>
      <span class="b" style="height:${Math.round((a.n / peak) * 100)}%"></span>
      <span class="d num">${a.date}</span></div>`).join("");
}

function renderFoot() {
  $("foot").innerHTML = `
    진행률은 계획 항목 수를 기준으로 계산합니다 — 완료 1, 진행 중 0.5, 미착수·막힘 0.
    작업량이나 난이도를 반영한 값은 아닙니다.<br>
    상태를 바꿔 「팀에 저장」을 누르면 이 화면이 새 판으로 발행되고, 열려 있는 모든
    사람의 화면이 그 판으로 갱신됩니다. 계획 항목·기간·작업량 수치를 고치는 것은
    아직 수동이며, 매일 아침 문서·저장소·노션을 읽어 자동으로 맞추는 방식은 다음 단계입니다.`;
}

function render() {
  renderHead(); renderBanner(); renderSaveBar(); renderTiles();
  renderTimeline(); renderCallout(); renderFilters(); renderSprints();
  renderLog(); renderExt(); renderBars(); renderFoot();
}

/* ══════════════════════════════════════════════════════════════════
   발행 — 페이지가 스스로를 새 버전으로 씁니다.

   화면에 그려진 DOM을 퍼오지 않습니다(실행 중 삽입된 스크립트와 그 순간의
   화면 상태가 섞입니다). 사람이 쓴 원본 세 덩어리 — 스타일·뼈대·이 스크립트 —
   를 그대로 다시 엮고, 바뀐 것은 상태 데이터뿐입니다.
   ══════════════════════════════════════════════════════════════════ */

function buildDocument(next) {
  const css = document.getElementById("css").textContent;
  const skeleton = document.getElementById("skeleton").innerHTML;
  const app = document.getElementById("app").textContent;
  const close = "<" + "/script>";   // 문자열 안에서 스크립트가 닫히지 않게 갈라 씁니다

  return "<!doctype html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n"
    + "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n"
    + "<title>품 개발 현황판</title>\n"
    + "<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n"
    + "<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n"
    + "<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap\">\n"
    + "<style id=\"css\">" + css + "</style>\n</head>\n<body>\n"
    + "<template id=\"skeleton\">" + skeleton + "</template>\n"
    + "<div id=\"root\"></div>\n"
    + "<script id=\"state\" type=\"application/json\">\n" + JSON.stringify(next, null, 1) + "\n" + close + "\n"
    + "<script id=\"app\">" + app + close + "\n"
    + "</body>\n</html>";
}

/** 저장 — 성공하면 이 화면도 새 판으로 다시 열립니다 */
async function save() {
  const list = pending();
  if (list.length === 0 || saving) return;

  const api = await claude.use("artifact");
  if (!api) { markReadOnly(); return; }

  saving = true;
  renderSaveBar();

  const stamp = new Date().toLocaleString("ko-KR", {
    month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit",
  });
  const next = structuredClone(state);
  next.rev = (base.rev ?? 1) + 1;
  next.log = [
    ...list.map((p) => ({ at: stamp, what: `${p.s.no}단계 · ${p.it.what}`, from: LABEL[p.was], to: LABEL[p.now] })),
    ...(base.log ?? []),
  ].slice(0, LOG_MAX);

  try {
    await api.publish(buildDocument(next));
    // 성공하면 화면이 새 판으로 다시 열리므로 여기서 더 할 일이 없습니다.
  } catch (err) {
    saving = false;
    const code = err && err.code;
    if (code === "conflict") {
      // 흔한 일입니다 — 다른 사람이 먼저 저장했고, 화면은 이미 그 판으로
      // 다시 열리는 중입니다. 다시 시도하지 않습니다.
      $("save-msg").textContent = "다른 분이 먼저 저장했습니다. 최신 판을 불러옵니다…";
      return;
    }
    if (code === "not_writer" || code === "not_granted" || code === "not_declared"
        || code === "capability_disabled" || code === "capability_removed") {
      markReadOnly();
      return;
    }
    if (code === "rate_limited") {
      $("save-msg").textContent = "저장이 너무 잦습니다. 잠시 뒤 다시 눌러 주세요.";
    } else if (code === "too_large") {
      $("save-msg").textContent = "내용이 너무 커서 저장하지 못했습니다.";
    } else {
      $("save-msg").textContent = "저장하지 못했습니다. 잠시 뒤 다시 눌러 주세요.";
    }
    renderSaveBar();
  }
}

function markReadOnly() {
  readOnly = true;
  saving = false;
  render();
}

/* ══════════════════════════════════════════════════════════════════
   동작
   ══════════════════════════════════════════════════════════════════ */

/* 화면 밝기 — 기기 설정 → 밝게 → 어둡게 순환. 개인 설정이라 공유되지 않습니다 */
$("theme").addEventListener("click", () => {
  const now = document.documentElement.getAttribute("data-theme");
  const next = now === "light" ? "dark" : now === "dark" ? null : "light";
  if (next) document.documentElement.setAttribute("data-theme", next);
  else document.documentElement.removeAttribute("data-theme");
  try { next ? localStorage.setItem(THEME_KEY, next) : localStorage.removeItem(THEME_KEY); } catch {}
});
try {
  const saved = localStorage.getItem(THEME_KEY);
  if (saved) document.documentElement.setAttribute("data-theme", saved);
} catch {}

/* 상태 바꾸기 · 카드 펼치기 */
$("sprints").addEventListener("click", (e) => {
  const chip = e.target.closest("button.chip");
  if (chip) {
    if (readOnly) return;
    const it = state.sprints[Number(chip.dataset.sp)].items[Number(chip.dataset.i)];
    it.status = CYCLE[(CYCLE.indexOf(it.status) + 1) % CYCLE.length];
    render();
    return;
  }
  const head = e.target.closest(".sp-head");
  if (!head) return;
  const card = head.closest(".sprint");
  const open = card.dataset.open === "true";
  openMap.set(Number(card.dataset.no), !open);
  card.dataset.open = String(!open);
  head.setAttribute("aria-expanded", String(!open));
  head.querySelector(".sp-caret").textContent = open ? "▼" : "▲";
});

/* 타임라인 막대 → 해당 카드 열고 이동 */
$("tl-rows").addEventListener("click", (e) => {
  const bar = e.target.closest(".tl-bar");
  if (!bar) return;
  const no = Number(bar.dataset.go);
  openMap.set(no, true);
  const card = document.querySelector(`.sprint[data-no="${no}"]`);
  if (!card) return;
  card.dataset.open = "true";
  const head = card.querySelector(".sp-head");
  head.setAttribute("aria-expanded", "true");
  head.querySelector(".sp-caret").textContent = "▲";
  card.scrollIntoView({ behavior: "smooth", block: "center" });
});

/* 필터 */
$("f-status").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  view.status = b.dataset.status; render();
});
$("f-area").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  view.area = b.dataset.area; render();
});

/* 검색 — 글자마다 다시 그리되 잠깐 기다려 타이핑이 밀리지 않게 합니다 */
let qTimer;
$("q").addEventListener("input", (e) => {
  const v = e.target.value.trim();
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { view.q = v; render(); }, 140);
});

/* 모두 펼치기·접기 */
function setAll(open) {
  for (const card of document.querySelectorAll(".sprint")) {
    openMap.set(Number(card.dataset.no), open);
    card.dataset.open = String(open);
    const head = card.querySelector(".sp-head");
    head.setAttribute("aria-expanded", String(open));
    head.querySelector(".sp-caret").textContent = open ? "▲" : "▼";
  }
}
$("all-open").addEventListener("click", () => setAll(true));
$("all-close").addEventListener("click", () => setAll(false));

/* 저장 · 되돌리기 */
$("save").addEventListener("click", () => { void save(); });
$("discard").addEventListener("click", () => {
  state = structuredClone(base);
  render();
});

/* 첫 그리기 */
render();

/* 저장할 수 있는 환경인지 확인합니다. 바탕화면 파일로 열면 `claude`가 없어
   읽기 전용이 되고, 보기 권한만 받은 팀원도 같은 화면을 봅니다. */
(async () => {
  try {
    if (typeof claude === "undefined" || !claude.use) { markReadOnly(); return; }
    const api = await claude.use("artifact");
    if (!api) markReadOnly();
  } catch { markReadOnly(); }
})();
</script>
</body>
</html>
